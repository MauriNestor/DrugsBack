version: '3.8'

services:
  app:
    container_name: 'farmacia_app'
    build: .
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/farmadocker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_CONNECTION_PROVIDER: org.hibernate.hikaricp.HikariCPConnectionProvider
      SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    container_name: 'farmacia_db'
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmadocker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmadocker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: